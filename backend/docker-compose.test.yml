services:
  mysql-test:
    image: mysql:8.0
    container_name: torque-mysql-test
    hostname: torque-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: torque_root_test_only
      MYSQL_DATABASE: torque_test
      MYSQL_USER: torque_test
      MYSQL_PASSWORD: torque_test_only
    ports:
      - "127.0.0.1:33306:3306"
    tmpfs:
      - /var/lib/mysql:rw,size=1g
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -utorque_test -ptorque_test_only --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: "no"
